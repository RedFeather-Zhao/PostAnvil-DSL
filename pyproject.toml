[build-system]
requires = [
  "scikit-build-core>=0.10",
  "pybind11>=2.13"
]
build-backend = "scikit_build_core.build"

[project]
name = "postanvil"
version = "0.8.0"
description = "PostAnvil object-detection post-processing DSL"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE.txt" }
authors = [
  { name = "RedFeather-Zhao" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS"
]

[project.optional-dependencies]
ultralytics = [
  "ultralytics>=8.3"
]

[tool.scikit-build]
cmake.build-type = "Release"
cmake.args = [
  "-DPOSTANVIL_BUILD_PYTHON=ON",
  "-DPOSTANVIL_BUILD_TESTS=OFF",
  "-DPOSTANVIL_BUILD_STATIC=ON",
  "-DPOSTANVIL_BUILD_SHARED=OFF"
]
wheel.packages = ["bindings/python/postanvil"]
sdist.include = [
  "bindings/python/**",
  "cmake/**",
  "docs/**",
  "generated/antlr/**",
  "grammar/**",
  "include/**",
  "src/**",
  "third_party/**",
  "tools/antlr/**",
  "CMakeLists.txt",
  "LICENSE.txt"
]
