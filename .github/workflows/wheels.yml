name: python-wheels

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v3.3
        env:
          CIBW_BUILD: >-
            ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
            && 'cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*'
            || 'cp312-*' }}
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=14.0"
          CIBW_TEST_COMMAND: >-
            python -c "import importlib.metadata as m, postanvil;
            assert m.version('postanvil') == postanvil.__version__"
            && python -c "import runpy;
            runpy.run_path(r'{project}/bindings/python/smoke_test.py', run_name='__main__')"
            && python -c "import runpy;
            runpy.run_path(r'{project}/bindings/python/compile_error_smoke_test.py', run_name='__main__')"
            && python -c "import runpy;
            runpy.run_path(r'{project}/bindings/python/ultralytics_smoke_test.py', run_name='__main__')"
        with:
          package-dir: .
          output-dir: wheelhouse

      - name: Upload platform wheels
        uses: actions/upload-artifact@v4
        with:
          name: postanvil-wheels-${{ matrix.platform }}-${{ runner.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14
