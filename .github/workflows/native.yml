name: native

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.build_type }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            build_type: Debug
            parallel: 4
            generator: ""
          - os: windows-latest
            platform: windows
            build_type: Release
            parallel: 4
            generator: ""
          - os: ubuntu-latest
            platform: ubuntu
            build_type: Debug
            parallel: 4
            generator: -G Ninja
          - os: ubuntu-latest
            platform: ubuntu
            build_type: Release
            parallel: 4
            generator: -G Ninja
          - os: macos-latest
            platform: macos
            build_type: Debug
            parallel: 3
            generator: -G Ninja
          - os: macos-latest
            platform: macos
            build_type: Release
            parallel: 3
            generator: -G Ninja
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure PostAnvil
        run: >-
          cmake -S . -B out/build/native ${{ matrix.generator }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DPOSTANVIL_BUILD_STATIC=ON -DPOSTANVIL_BUILD_SHARED=ON
          -DPOSTANVIL_BUILD_TESTS=ON
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/out/install/native

      - name: Build PostAnvil
        run: >-
          cmake --build out/build/native --config ${{ matrix.build_type }}
          --parallel ${{ matrix.parallel }}

      - name: Run native tests
        run: >-
          ctest --test-dir out/build/native -C ${{ matrix.build_type }}
          --output-on-failure

      - name: Install SDK
        run: >-
          cmake --install out/build/native --config ${{ matrix.build_type }}
          --prefix "${{ github.workspace }}/out/install/native"

      - name: Configure installed-package consumer
        run: >-
          cmake -S tests/package_consumer -B out/build/package-consumer
          ${{ matrix.generator }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/out/install/native"

      - name: Build installed-package consumer
        run: >-
          cmake --build out/build/package-consumer
          --config ${{ matrix.build_type }} --parallel ${{ matrix.parallel }}

      - name: Test installed-package consumer
        run: >-
          ctest --test-dir out/build/package-consumer
          -C ${{ matrix.build_type }} --output-on-failure

      - name: Create platform SDK archive
        working-directory: out/install
        run: >-
          cmake -E tar cfv
          PostAnvil-${{ matrix.platform }}-${{ runner.arch }}-${{ matrix.build_type }}.zip
          --format=zip native

      - name: Upload platform SDK
        uses: actions/upload-artifact@v4
        with:
          name: PostAnvil-${{ matrix.platform }}-${{ runner.arch }}-${{ matrix.build_type }}
          path: out/install/PostAnvil-${{ matrix.platform }}-${{ runner.arch }}-${{ matrix.build_type }}.zip
          if-no-files-found: error
          retention-days: 14
